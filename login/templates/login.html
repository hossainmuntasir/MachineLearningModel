<html>
    <head>
        <meta charset="UTF-8">
        <title> Login </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> 
        <div class=logo-top >
        <img src="{{ url_for('static', filename='../static/images/logo.svg') }}" alt="Company Logo 1" class="footer-logo logo-1">     
        <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>          
        </div>
      </head>
    <body></br></br></br></br></br>
        <div align="center">
          <div align="center" class="border">
             <div class="header">
                <h1 class="word">Login</h1>
                <title> Login </title>
             </div></br> </br></br>
             
            <h2 class="word">
                <form action="{{ url_for('login') }}" method="post" onsubmit="return validateUsernameSelection()">
                  <div class="msg">{{ msg }}</div> 
                    <!-- <input id="username" name="username" type="text" placeholder="Enter Your Username" class="textbox"/></br></br> -->
                    <select id="usernameSelect" name="usernameSelect"  class="textbox" onchange="fillPassword()">
                      <option value="" disabled selected >Select an Account</option>
                      <option value="admin1">Building Manager 1</option>
                      <option value="admin2">Building Manager 2</option>
                      <option value="admin3">Building Manager 3</option>
                      <option value="adminr">Administrator</option>
                      <option value="custom">Custom</option>
                    </select>
                    <input id="username" name="username" type="text" placeholder="Enter Your Username" class="textbox" />
                    <input id="password" name="password" type="password" placeholder="Enter Your Password" class="textbox"/></br></br></br>
                    <input type="submit" value="Sign In">
                </form> 
            </h2>
            
            <p class="bottom">Don't have an account?  <a class="bottom" href="{{url_for('register')}}"> Sign Up here</a></p>
          </div>
        </div>
    </body>
  <div class=logo-top >
    <img src="{{ url_for('static', filename='../static/images/logo-long-full.svg') }}" alt="Company Logo 2" class="footer-logo logo-2">
   </div>
  </html>
